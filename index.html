<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historische Karte & Gastronomie Posen 1896</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { margin: 0; padding: 0; }
        #map { width: 100vw; height: 100vh; }

        /* Entfernt den weißlichen Hintergrund der gescannten Karte */
        .multiply-effect {
            mix-blend-mode: multiply;
        }

        /* Schönere Popups */
        .leaflet-popup-content h3 {
            margin: 0 0 5px 0;
            color: #2c3e50;
        }
        .leaflet-popup-content p {
            margin: 3px 0;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Karte initialisieren (Start-Zoom 15, Max-Zoom 18)
        const map = L.map('map', {
            center: [52.4086, 16.9342],
            zoom: 15,
            maxZoom: 18
        });

        // 2. OpenStreetMap Hintergrundkarte
        const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // 3. Historische Karte Posen (Ordner 12 bis 18)
        const posen1907 = L.tileLayer('./{z}/{x}/{y}.jpg', {
            minZoom: 12,
            maxZoom: 18,
            maxNativeZoom: 17,
            tms: false,
            className: 'multiply-effect',
            attribution: 'Historische Karte Posen'
        }).addTo(map);

        // 4. Layer Group für die Restaurateure 1896
        const layer1896 = L.layerGroup().addTo(map);

        // 5. GeoJSON-Datei laden und verarbeiten
        fetch('./1896-Restaurateure.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error("HTTP Fehler " + response.status);
                }
                return response.json();
            })
            .then(data => {
                L.geoJSON(data, {
                    pointToLayer: function (feature, latlng) {
                        // Roter Kreis-Marker für jeden Gastronomie-Punkt
                        return L.circleMarker(latlng, {
                            radius: 7,
                            fillColor: "#e74c3c",
                            color: "#ffffff",
                            weight: 2,
                            opacity: 1,
                            fillOpacity: 0.9
                        });
                    },
                    onEachFeature: function (feature, layer) {
                        // Liest die Daten aus deiner Google-KML/GeoJSON aus
                        const props = feature.properties || {};
                        const name = props.name || 'Unbenannter Ort';
                        const description = props.description || 'Keine Beschreibung vorhanden';

                        layer.bindPopup(`
                            <div>
                                <h3>${name}</h3>
                                <div>${description}</div>
                            </div>
                        `);
                    }
                }).addTo(layer1896);
            })
            .catch(error => {
                console.error("Fehler beim Laden der GeoJSON-Datei:", error);
            });

        // 6. Ebenen-Steuerung oben rechts
        const baseMaps = {
            "OpenStreetMap": osm
        };

        const overlayMaps = {
            "Historische Karte (1907)": posen1907,
            "Restaurateure 1896": layer1896
        };

        L.control.layers(baseMaps, overlayMaps).addTo(map);
    </script>
</body>
</html>
