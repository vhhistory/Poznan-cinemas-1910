<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historische Karte Posen 1907</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { margin: 0; padding: 0; }
        #map { width: 100vw; height: 100vh; }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Karte auf Posen zentrieren
        const map = L.map('map').setView([52.4086, 16.9342], 13);

        // 2. OpenStreetMap Hintergrundkarte
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // 3. Historische Karte (jetzt auf .jpg angepasst)
        const posen1907 = L.tileLayer('./{z}/{x}/{y}.jpg', {
            minZoom: 12,
            maxZoom: 15,
            maxNativeZoom: 15,
            tms: false,        // Falls die Kacheln an falschen Orten liegen, probiere hier true aus
            opacity: 0.8,
            attribution: 'Historische Karte Posen 1907'
        }).addTo(map);

        // 4. Ebenen-Steuerung (Oben rechts)
        const overlayMaps = {
            "Posen 1907": posen1907
        };
        L.control.layers(null, overlayMaps).addTo(map);
    </script>
</body>
</html>
